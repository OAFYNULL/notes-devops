---
- name: Deploy Notes DevOps application
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run Notes application container
      docker_container:
        name: notes-devops-web
        image: notes-devops-app:latest
        state: started
        ports:
          - "5000:5000"
